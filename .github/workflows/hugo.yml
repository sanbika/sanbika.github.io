name: Deploy Hugo site

# Migrated from peaceiris/actions-gh-pages to the official Pages Actions:
# the previous branch-push approach relied on GitHub Pages detecting a new
# tip on `gh-pages`, which `force_orphan: true` skipped on rare occasions
# (Pages kept serving the previous build indefinitely). The official path
# drives Pages via the `pages-deployment` API and is atomically consistent.
#
# IMPORTANT: this workflow requires the repo's Pages source to be set to
# "GitHub Actions" under Settings → Pages, otherwise the deploy job will
# fail with "Pages is enabled but no source is configured".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deploy at a time. cancel-in-progress: false so a
# push mid-deploy waits for the in-flight deploy to finish instead of
# starting a parallel deploy on stale artifacts.
concurrency:
  group: pages
  cancel-in-progress: false

# Minimum scopes for the official Pages Actions deploy.
#   contents:read  — checkout
#   pages:write    — create the Pages deployment
#   id-token:write — Pages OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify --gc --buildFuture

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4