[params]
  env = "auto"
  defaultTheme = "auto"
  description = "sanbika 的个人主页与博客"
  author = "sanbika"
  avatar = "images/avatar.jpg"
  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  enableSearch = true
  mainSections = ["posts"]
  # Feed sections. The "posts" section is currently empty (its only page was a
  # placeholder deleted on 2026-10-20), so a feed bound to mainSections alone
  # would be empty even though the site still has real content: the 8 archived
  # days under content/quests/. mainSections deliberately keeps pointing at
  # "posts" so that the first real post lands in the home page main column and
  # in the feed automatically.
  rssSections = ["quests", "posts"]
  displayFullLangName = true

# Site assets (favicon / theme color)
[params.assets]
  theme_color = "#5B5BD6"
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"

# Social icons (referenced by the home page sidebar, layouts/index.html)
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/sanbika"

[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

# Comments (Giscus)
[params.comments]
  enabled = true
  provider = "giscus"
  [params.comments.giscus]
    repo = "sanbika/sanbika.github.io"
    repoId = "R_kgDOT2zk8Q"
    category = "General"
    categoryId = "DIC_kwDOT2zk8c4DDQPs"
    mapping = "pathname"
    lightTheme = "light"
    darkTheme = "dark_dimmed"
    reactionsEnabled = true
    # Giscus category dedicated to the "Daily Spark" comments on the archive
    # page, kept separate from the General category used for article comments.
    # Daily generation was retired in 2026-10; the discussions under this
    # category are the comment threads of the 8 archived days themselves —
    # the archive page maps them back with a specific mapping + spark-<date> term.
    [params.comments.spark]
      category = "daily-spark"
      categoryid = "DIC_kwDOT2zk8c4DDbVZ"

# Google Analytics
[params.analytics.google]
  id = "G-R7BQ8WQQ38"
