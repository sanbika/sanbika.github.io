[params]
  env = "auto"
  defaultTheme = "auto"
  description = "sanbika 的个人主页与博客"
  author = "sanbika"
  avatar = "images/avatar.jpg"
  DateFormat = "2006-01-02"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  enableSearch = true
  mainSections = ["posts"]
  displayFullLangName = true

# 站点资源（favicon / 主题色）
[params.assets]
  theme_color = "#5B5BD6"
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"

# 社交图标（首页侧栏（layouts/index.html）引用）
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/sanbika"

[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

# 评论（Giscus）
[params.comments]
  enabled = true
  provider = "giscus"
  [params.comments.giscus]
    repo = "sanbika/sanbika.github.io"
    repoId = "R_kgDOT2zk8Q"
    category = "General"
    categoryId = "DIC_kwDOT2zk8c4DDQPs"
    mapping = "pathname"
    lightTheme = "light"
    darkTheme = "dark_dimmed"
    reactionsEnabled = true
    # 首页「每日打卡」评论专用 Giscus 分类：与文章评论的 General 分离
    [params.comments.spark]
      category = "daily-spark"
      categoryid = "DIC_kwDOT2zk8c4DDbVZ"

# Google Analytics
[params.analytics.google]
  id = "G-R7BQ8WQQ38"
